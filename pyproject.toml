[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "gesture-controls"
version = "0.1.0"
description = "Local-only webcam hand-landmark prototype for Windows"
requires-python = ">=3.12,<3.13"
dependencies = [
  "mediapipe==0.10.21",
  "numpy==1.26.4",
  "opencv-contrib-python==4.11.0.86",
  "PyAutoGUI==0.9.54",
  "pystray==0.19.5",
]

[project.scripts]
gesture-controls = "gesture_controls.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
